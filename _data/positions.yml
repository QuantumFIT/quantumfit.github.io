# Contact details shown on the About page (pages/about.md), as two cards:
#
#   contact -- how to reach a person electronically (name, e-mail, web)
#   postal  -- where to send physical mail. It deliberately carries NO e-mail
#              address; an e-mail address is not part of a postal address.
#
# Name, e-mail and the address were taken from
# https://www.fit.vut.cz/person/lengal/ . Note the postal code: this file
# previously said 612 66, which is out of date -- FIT lists 612 00.

contact:
  name: "Ondřej Lengál"
  email: "lengal@fit.vut.cz"
  # The faculty's site. Not the PI's personal page -- that link is kept
  # exclusive to the Team page (bio_link in group.yml).
  web: "https://www.fit.vut.cz/"

postal:
  # The addressee line is not repeated here: pages/about.md puts contact.name
  # at the top of this block, so the two cannot drift apart.
  # Rendered one per line, in this order.
  lines:
    - "Faculty of Information Technology"
    - "Brno University of Technology"
    - "Božetěchova 2"
    - "612 00 Brno"
    - "Czech Republic"
