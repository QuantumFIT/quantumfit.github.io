# What the group is about, shown as the Focus band on the home page
# (_layouts/home.html). Each entry is one paragraph, markdownified, so
# *emphasis* and [links](...) work inside one.
#
# Written as folded block scalars (`>`) rather than quoted strings for one
# specific reason: the name has to be escaped as `\|` here.
#
# The text is markdownified, and kramdown reads a bare `|` as a table cell
# separator -- a line containing one becomes a one-row <table>, which is how
# the About page broke once already. `\|` is the escape, and a double-quoted
# YAML string would try to interpret that backslash and fail to parse.

paragraphs:
  - >
    **\|QuantumFIT⟩** is a research group at FIT BUT bringing together
    researchers and students interested in studying **quantum computing
    systems** in a broad range. The main aim of the group is to empower the
    transition from today's noisy, small-scale quantum devices to machines
    delivering a **practical quantum advantage**, by developing the
    algorithmic foundations and the software tools needed to design quantum
    computations, analyse them, and make their results trustworthy.

  - >
    The group builds on a strong background in **formal methods**, **automated
    reasoning**, and automata theory, and transfers these techniques into the
    quantum domain: automata and decision diagram models of quantum states and
    operations, decision procedures based on SAT/SMT solving, and rigorous
    semantics of quantum circuits and programs. On these foundations we
    develop prototype tools — simulators, optimizers, verifiers, synthesis
    engines, and tools supporting the design of quantum error-correcting codes
    — and design new computations: quantum algorithms and trusted building
    blocks that come with correctness guarantees and a known resource cost.

# A closing line addressed to students, boxed off from the paragraphs above
# (see .focus-invite in _sass/_home.scss). It stops mid-sentence on
# purpose: the layout appends the PI's name as a mailto link built from
# _data/positions.yml, so the address stays in exactly one place in the repo.
