# News items, newest first (shown on Home and News pages). Both templates sort
# by `date` themselves, so file order is for humans only.
#
# `description` is rendered as plain text, not markdown -- asterisks and
# brackets would show up literally. `url` is optional: both templates hide the
# "Read more" link when it is unset.
#
# `category` is shown as-is on the home page and capitalised on the News page,
# so keep it one lower-case word. In use so far: award.

# PLDI'23 ran 17-21 June 2023 and its programme has no awards ceremony: the
# Distinguished Paper designation appears as a badge on the paper itself. So
# the date here is the paper's own session, Mon 19 June 2023 at 10:20 in
# https://pldi23.sigplan.org/track/pldi-2023-pldi , which is when it was
# presented as a Distinguished Paper. There is no more specific date to use.
- title: "Distinguished Paper Award at PLDI'23"
  date: 2023-06-19
  description: "An Automata-based Framework for Verification and Bug Hunting in Quantum Circuits was named a Distinguished Paper at PLDI'23 in Orlando, Florida. The paper introduces the tree-automata approach behind AutoQ."
  url: "https://doi.org/10.1145/3591270"
