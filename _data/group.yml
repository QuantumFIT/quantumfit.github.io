# Group members, shown on the Team page (pages/team.md).
#
# Fields for the PI: name, image (optional, path under images/), bio,
# bio_link (optional).
# Fields for everyone else: name, web, role (required in phd_and_postdocs,
# see below), period (optional, e.g. "since 2026").
#
# Non-PI cards carry the name and the role tag and nothing else -- no bio, no
# affiliation. Everyone here is at FIT BUT, so printing that on every card said
# nothing; `web` (an ABSOLUTE URL, the person's FIT BUT profile) turns the name
# into the link to the details instead.
#
# bio_link, used only by the PI, is the opposite: it must be a SITE-RELATIVE
# path, because pages/team.md renders it as {{ site.url }}{{ member.bio_link }}
# and an absolute URL would come out as
# https://quantumfit.github.io/https://example.org/ .

principle_investigator:
  - name: "Ondřej Lengál"
    image:
    bio: >-
      Associate professor at the Faculty of Information Technology, Brno
      University of Technology. His work combines automata theory with the
      verification and simulation of quantum circuits and programs, and also
      covers SMT solving and efficient regular expression matching. He
      habilitated in 2025 with *Awesome Automata: Algorithms and Applications*.
    bio_link: "/about/"

# PhD students and postdocs share one list rather than sitting in separate
# sections: the group is small. Which of the two a person is is carried by
# `role`, rendered as a pill under the name, so EVERY entry here needs one --
# a card is otherwise just a name, with no way to tell. Use exactly
# "PhD Student" or "Postdoc". Ordered by surname.
#
# Every `web` URL below was verified to resolve and to name the right person.
# Do the same for a new one rather than pattern-matching it: the FIT login is
# not derivable from the surname (Havlena is `ihavlena`, not `havlena`), and
# some people have no login alias at all, only the numeric id the faculty's
# staff listing links to. Guessing is actively risky here -- `inovak` resolves,
# but to a different Novák.
#
# `web` is optional. Not everyone has a FIT page: the faculty publishes one for
# staff, so a student who is not also employed has none, and pages/team.md
# renders those names as plain text.
phd_and_postdocs:
  - name: "Vojtěch Havlena"
    role: "Postdoc"
    web: "https://www.fit.vut.cz/person/ihavlena/"

  - name: "Michal Hečko"
    role: "PhD Student"
    web: "https://www.fit.vut.cz/person/ihecko/"

# Ordered by surname, as above.
undergraduate_students:
  - name: "Jakub Havlík"
    web: "https://www.fit.vut.cz/person/260286/"

  # No `web`: she has no FIT person page -- the faculty publishes those for
  # staff, and the unit staff listings do not carry her. Her name renders as
  # plain text until there is somewhere to point it.
  - name: "Sára Jobranová"

  - name: "Filip Novák"
    web: "https://www.fit.vut.cz/person/259543/"

alumni: []
