# Site settings
locale                   : "en-US"
title                    : "QuantumFIT"
title_separator          : "-"
name                     : "QuantumFIT"
description              : "QuantumFIT is a research group at the Faculty of Information Technology, Brno University of Technology, focused on quantum computing and quantum software engineering."
url                      : "https://quantumfit.github.io"
baseurl                  : ""
repository               : "QuantumFIT/quantumfit.github.io"

# Theme: pulled in at build time, nothing to install/fork.
# https://github.com/academicpages/academicpages.github.io (built on Minimal Mistakes)
remote_theme              : "academicpages/academicpages.github.io"
site_theme                : "default"

# Sidebar author box is designed for a single person; not used on a group site.
author:
  name              : "QuantumFIT"
  avatar            :
  bio               :
  location          : "Faculty of Information Technology, Brno University of Technology"
  employer          :
  email             :
  github            :

breadcrumbs               : false
words_per_minute           : 160
future                     : true
read_more                  : "disabled"
comments:
  provider                 : false
atom_feed:
  hide                     : false

analytics:
  provider                 : false

# Reading files
include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

collections:
  publications:
    output: true
    permalink: /:collection/:path/

defaults:
  # _posts (used as News items)
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: false
      comments: false
      share: false
      related: false
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: false
      share: false
      comments: false

sass:
  sass_dir: _sass
  style: compressed

permalink: /news/:year/:month/:day/:title/
timezone: Europe/Prague

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-sitemap
  - jekyll-feed

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
