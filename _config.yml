title:            QuantumFIT
description:      "QuantumFIT is the Quantum Computing Systems research group at the Faculty of Information Technology, Brno University of Technology, focused on quantum computing and quantum software engineering."
# The custom domain, and the name in CNAME. This has to track CNAME: every
# asset, canonical link, og:url and sitemap entry is built from site.url, and
# GitHub 301s the quantumfit.github.io host to whatever CNAME says. Left
# pointing at the old host, every page still renders but fetches all thirty of
# its subresources cross-origin through that redirect, and advertises the wrong
# canonical URL to search engines.
url:              "https://quantum.fit.vut.cz"
baseurl:          ""

reading_time: false
word_count: false
excerpt_separator: "<!--more-->"

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# No theme setting: the theme is vendored into this repo (_sass, _includes,
# _layouts, assets), copied from
# https://github.com/liuyxpp/liuyxpp.github.io @ 8d46aef2e6d81e7757745f816aaedc55f6bb4c9f
# -- the commit `remote_theme:` used to be pinned to. It was vendored so the
# colour definitions could be edited directly, which is what site-wide dark
# mode needs: the theme's palette is Sass variables, and dark mode needs
# runtime CSS custom properties, so `lighten()`/`darken()`/`mix()` call sites
# inside the theme's own partials had to become editable.

# Main author of the website (see _data/authors.yml)
author: quantumfit

owner:
  name:           QuantumFIT
  avatar:
  bio:            "QuantumFIT is the Quantum Computing Systems research group at the Faculty of Information Technology, Brno University of Technology."
  email:
  twitter:
  facebook:
  github: QuantumFIT
  stackexchange:
  linkedin:
  instagram:

background:

timezone: Europe/Prague
future: true
highlighter: rouge
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..3

include: [".htaccess"]
# `exclude` keeps files in the repo but out of the built site.
#
# The background PNGs are kept as the original, lossless sources but are not
# published: the hero uses images/background2.webp (0.14 MB rather than
# 1.72 MB), and background1/background3 are not referenced anywhere. Publishing
# them would ship ~5 MB that nothing links to.
#
# If the hero is ever pointed back at a .png, that file has to come off this
# list or it will 404.
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - node_modules
  - images/background1.png
  - images/background2.png
  - images/background3.png
