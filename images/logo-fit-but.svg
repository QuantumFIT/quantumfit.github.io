<!--
  Brno University of Technology, Faculty of Information Technology.

  The faculty's own English wordmark, taken from the sprite its site serves
  at https://www.fit.vut.cz/img/bg/icons-svg.svg (the symbol whose id is
  icon-logo-fit-en, large variant) and saved here as a standalone file
  rather than hot-linked, so the home page does not depend on that sprite
  staying where it is.

  That variant on purpose: its lettering is white INSIDE the red and blue
  blocks, so the mark reads the same on the dark hero as on a light page.
  The compact variant knocks its letters out of the blocks instead, and they
  turn dark when the background does.

  No double hyphen anywhere in this comment: it is forbidden inside an XML
  comment and makes the whole file unparseable, which is how a favicon was
  once silently lost.
-->
